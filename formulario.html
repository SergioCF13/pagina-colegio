<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones - Colegio Padre Luis Variara</title>
    <link rel="stylesheet" href="formulario.css">
</head>
<body>
    <h1><center>FORMULARIO DE INSCRIPCIÓN - COLEGIO PADRE LUIS VARIARA</center></h1>

    <a href="index.html">Ir a la página principal</a>
    <a href="nosotros.html">Ir a Nosotros y Galería</a>
    <a href="tabla.html">Ir a Horarios y Cursos</a>

    <form>
        <label>Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label>Apellido:</label>
        <input type="text" id="apellido" name="apellido" required><br><br>

        <label>Edad:</label>
        <input type="number" id="edad" name="edad" required><br><br>

        <label>Fecha de nacimiento:</label>
        <input type="date" id="fecha" name="fecha" required><br><br>

        <label>Curso:</label>
        <select id="curso" name="curso" required>
            <option value="">Seleccione un curso</option>
            <option value="Primaria">Primaria (1ro a 6to)</option>
            <option value="1ro Secundaria">1ro de Secundaria</option>
            <option value="2do Secundaria">2do de Secundaria</option>
            <option value="3ro Secundaria">3ro de Secundaria</option>
            <option value="4to Secundaria">4to de Secundaria</option>
            <option value="5to Secundaria">5to de Secundaria</option>
            <option value="6to Secundaria">6to de Secundaria</option>
        </select><br><br>

        <label>Teléfono:</label>
        <input type="tel" id="telefono" name="telefono"><br><br>

        <input type="submit" value="Enviar datos">
    </form>
</body>
</html>
